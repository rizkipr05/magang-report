<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <rect width="1000" height="420" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13">
    <!-- Users -->
    <rect x="40" y="30" width="220" height="80" rx="6" fill="#f3f4f6" stroke="#111827"/>
    <text x="150" y="55" font-weight="700" text-anchor="middle">users</text>
    <text x="70" y="80">- id (pk)</text>
    <text x="70" y="100">- name</text>
    <text x="70" y="120">- role (siswa/guru/dudi)</text>

    <!-- Dudi -->
    <rect x="320" y="30" width="220" height="80" rx="6" fill="#eef2ff" stroke="#3730a3"/>
    <text x="430" y="55" font-weight="700" text-anchor="middle">dudi</text>
    <text x="350" y="80">- id (pk)</text>
    <text x="350" y="100">- name</text>
    <text x="350" y="120">- contact</text>

    <!-- Magang -->
    <rect x="600" y="30" width="320" height="80" rx="6" fill="#ecfccb" stroke="#65a30d"/>
    <text x="760" y="55" font-weight="700" text-anchor="middle">magang</text>
    <text x="630" y="80">- id (pk)</text>
    <text x="630" y="100">- user_id (fk users)</text>
    <text x="630" y="120">- dudi_id (fk dudi)</text>

    <!-- Logbook -->
    <rect x="40" y="160" width="440" height="90" rx="6" fill="#fff7ed" stroke="#b45309"/>
    <text x="260" y="185" font-weight="700" text-anchor="middle">logbooks</text>
    <text x="60" y="210">- id (pk)</text>
    <text x="60" y="230">- magang_id (fk magang)</text>
    <text x="60" y="250">- tanggal, kegiatan, kendala</text>

    <!-- Reviews -->
    <rect x="520" y="160" width="400" height="90" rx="6" fill="#eef2ff" stroke="#1e3a8a"/>
    <text x="720" y="185" font-weight="700" text-anchor="middle">reviews</text>
    <text x="540" y="210">- id (pk)</text>
    <text x="540" y="230">- logbook_id (fk logbooks)</text>
    <text x="540" y="250">- reviewer_id (fk users), komentar, status</text>

    <!-- arrows / relations -->
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M0,0 L0,10 L10,5 z" fill="#444" />
      </marker>
    </defs>
    <line x1="200" y1="110" x2="200" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="430" y1="110" x2="430" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="740" y1="110" x2="340" y2="160" stroke="#444" stroke-width="2" marker-end="url(#arrow2)"/>
  </g>
</svg>
